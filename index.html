<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Concepts Check</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #77a766;
            --dark: #232323;
            --accent: #e8d227;
            --light: #f2f1e8;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(-45deg, #77a766, #232323, #77a766, #232323);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark);
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #quiz-container {
            background-color: var(--light);
            width: 90%;
            max-width: 650px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
        }

        h2 { font-weight: 700; margin-bottom: 20px; text-transform: lowercase; }
        h2::first-letter { text-transform: uppercase; }

        .question { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        button {
            background-color: #ffffff;
            border: 2px solid var(--primary);
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--dark);
            text-align: left;
        }

        button:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        #feedback {
            margin-top: 25px;
            font-weight: 500;
            min-height: 30px;
            padding: 10px;
            border-radius: 8px;
        }

        .correct { color: var(--primary); border: 1px solid var(--primary); background: #eef5ed; }
        .wrong { color: #cc3300; border: 1px solid #cc3300; background: #fceceb; }

        .hidden { display: none; }

        #score-screen h1 { color: var(--primary); font-size: 4rem; margin: 10px 0; }
        
        .retry-btn {
            background-color: var(--accent) !important;
            border: none !important;
            margin-top: 20px;
            font-weight: 700;
            text-align: center !important;
            width: 200px;
        }

        .progress {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .symbol-container {
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="question-screen">
        <div class="progress" id="progress-text">Question 1 of 7</div>
        <h2 id="q-title">Algorithm mastery</h2>
        <div id="symbol-area"></div>
        <div class="question" id="q-text">Loading question...</div>
        <div class="options-grid" id="options"></div>
        <div id="feedback"></div>
    </div>

    <div id="score-screen" class="hidden">
        <h2>Quiz complete</h2>
        <p>Your final score is:</p>
        <h1 id="final-score">0</h1>
        <p>well done on completing the algorithm check.</p>
        <button onclick="location.reload()" class="retry-btn">Restart quiz</button>
    </div>
</div>

<script>


    const subroutineSymbolSVG = `
        <div class="symbol-container">
            <svg width="200" height="70" viewBox="0 0 200 70" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="5" width="190" height="60" rx="2" ry="2"
                      fill="#f9f9fa" stroke="#77a766" stroke-width="2.5"/>
                <line x1="24" y1="5" x2="24" y2="65" stroke="#77a766" stroke-width="2.5"/>
                <line x1="176" y1="5" x2="176" y2="65" stroke="#77a766" stroke-width="2.5"/>
                <text x="100" y="40" text-anchor="middle" font-family="Outfit, sans-serif"
                      font-size="14" fill="#232323" font-weight="500">CalculateTotal()</text>
            </svg>
        </div>`;

    const quizData = [
        {
            q: "A robot program uses 'subroutine TurnRight()'. What is the term for the unique name 'TurnRight'?",
            options: [
                "An identifier",
                "A secret password",
                "A logical operator",
                "A loop counter"
            ],
            correct: "An identifier",
            feedback: "An identifier is the unique name given to a sub-routine so it can be called.",
            symbol: null
        },
        {
            q: "In an algorithm for a login system, a block of code starts with 'subroutine ValidatePIN()'. How must this block end?",
            options: [
                "endsubroutine",
                "stop",
                "exit",
                "return"
            ],
            correct: "endsubroutine",
            feedback: "The keyword 'endsubroutine' marks the end of the self-contained block.",
            symbol: null
        },
        {
            q: "Why is using a sub-routine better than writing the same instructions multiple times?",
            options: [
                "It makes the computer run cooler",
                "The code is written once but can be used many times",
                "It automatically fixes syntax errors",
                "It deletes unused variables"
            ],
            correct: "The code is written once but can be used many times",
            feedback: "This avoids code repetition and makes management much easier.",
            symbol: null
        },
        {
            q: "A flowchart shows the symbol below containing 'CalculateTotal()'. What does this symbol represent?",
            options: [
                "A call to a sub-routine",
                "An input from a sensor",
                "A decision point",
                "The end of the program"
            ],
            correct: "A call to a sub-routine",
            feedback: "The predefined process symbol — a rectangle with a vertical line on each inner side — indicates a sub-routine call.",
            symbol: subroutineSymbolSVG
        },
        {
            q: "How can a programmer use a sub-routine they created in one part of an algorithm in a completely different algorithm?",
            options: [
                "By calling its identifier in the new program",
                "By printing the code on paper",
                "By rewriting every line again",
                "By changing it into a diamond shape"
            ],
            correct: "By calling its identifier in the new program",
            feedback: "Sub-routines are portable and can be reused across different programs.",
            symbol: null
        },
        {
            q: "Which best describes a sub-routine?",
            options: [
                "A self-contained program called from another program",
                "A list of numbers stored in order",
                "A hardware component in the CPU",
                "A type of internet connection"
            ],
            correct: "A self-contained program called from another program",
            feedback: "It is a modular part of an algorithm designed for a specific task.",
            symbol: null
        },
        {
            q: "In pseudocode, which syntax is used to trigger the sub-routine named 'DisplayScore'?",
            options: [
                "DisplayScore()",
                "run score",
                "goto score",
                "repeat score"
            ],
            correct: "DisplayScore()",
            feedback: "You use the identifier followed by parentheses to call the sub-routine.",
            symbol: null
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    const qText = document.getElementById('q-text');
    const optionsContainer = document.getElementById('options');
    const feedback = document.getElementById('feedback');
    const questionScreen = document.getElementById('question-screen');
    const scoreScreen = document.getElementById('score-screen');
    const progressText = document.getElementById('progress-text');
    const symbolArea = document.getElementById('symbol-area');

    function launchConfetti() {
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const colors = ['#77a766', '#e8d227', '#f2f1e8', '#ffffff', '#232323'];
        const particles = Array.from({ length: 150 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            w: Math.random() * 10 + 5,
            h: Math.random() * 6 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            vx: (Math.random() - 0.5) * 3,
            vy: Math.random() * 4 + 2,
            angle: Math.random() * 360,
            spin: (Math.random() - 0.5) * 6
        }));
        let frame = 0;
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.save();
                ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
                ctx.rotate((p.angle * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
                p.x += p.vx;
                p.y += p.vy;
                p.angle += p.spin;
                if (p.y > canvas.height) p.y = -20;
            });
            frame++;
            if (frame < 180) requestAnimationFrame(draw);
            else canvas.remove();
        }
        draw();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function loadQuestion() {
        feedback.innerHTML = "";
        feedback.className = "";
        optionsContainer.innerHTML = "";
        const data = quizData[currentQuestion];
        
        progressText.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
        qText.innerText = data.q;

        // Show or hide symbol
        if (data.symbol) {
            symbolArea.innerHTML = data.symbol;
        } else {
            symbolArea.innerHTML = "";
        }

        let shuffledOptions = [...data.options];
        shuffleArray(shuffledOptions);

        shuffledOptions.forEach((opt) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, data.correct);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct) {
        const data = quizData[currentQuestion];
        const buttons = optionsContainer.getElementsByTagName('button');
        
        if (selected === correct) {
            score++;
            feedback.innerHTML = `Correct! ${data.feedback}`;
            feedback.className = "correct";
            
            for(let b of buttons) b.style.pointerEvents = "none";

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < quizData.length) {
                    loadQuestion();
                } else {
                    showScore();
                }
            }, 1800);
        } else {
            feedback.innerHTML = "not quite. check your definitions and try again!";
            feedback.className = "wrong";
        }
    }

    function showScore() {
        questionScreen.classList.add('hidden');
        scoreScreen.classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;
        
        launchConfetti();
    }

    shuffleArray(quizData);
    loadQuestion();
</script>

</body>
</html>
